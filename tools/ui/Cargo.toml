[package]
name = "sonicdiar-ui"
description = "A local web page for trying the SDK: record, pause, live transcript with speaker labels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Whisper on the GPU through Vulkan (Windows/Linux); needs the Vulkan SDK to build.
vulkan = ["sonicdiar/vulkan"]

[dependencies]
sonicdiar = { path = "../../crates/sonicdiar" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tiny_http = "0.12"

[lints]
workspace = true
