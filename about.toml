# cargo-about: generates THIRD-PARTY-LICENSES.md for the release packages
#   cargo about generate about.hbs -o THIRD-PARTY-LICENSES.md
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
ignore-transitive-dependencies = false
private = { ignore = true }
