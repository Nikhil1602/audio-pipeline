[package]
name = "sd-diar"
description = "Speaker diarization for SonicDiar: Kaldi fbank, WeSpeaker embeddings, clustering, DER"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# ONNX Runtime is shared with the VAD (one environment per process, loaded at run time).
sd-vad = { path = "../sd-vad" }
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-23"] }
ndarray = "0.17"
realfft = "3.5"
thiserror.workspace = true

[lints]
workspace = true
