[package]
name = "sd-asr"
description = "Speech recognition for SonicDiar: language table, engines, text metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["whisper", "indic"]
# Whisper via whisper.cpp (built from source by whisper-rs-sys; needs CMake and a C++ compiler).
whisper = ["dep:whisper-rs"]
# GPU acceleration through Vulkan (NVIDIA, AMD, Intel). Building needs the Vulkan SDK
# (VULKAN_SDK); at run time only the GPU driver is needed.
vulkan = ["whisper", "whisper-rs/vulkan"]
# IndicConformer-600M (Indic languages, Odia included) on ONNX Runtime, which is loaded at run
# time like the VAD's.
indic = ["dep:sd-vad", "dep:ort", "dep:ndarray", "dep:realfft", "dep:zip", "dep:serde_json"]

[dependencies]
tracing.workspace = true
crossbeam-channel.workspace = true
thiserror.workspace = true
unicode-general-category = "1.1"
unicode-normalization = "0.1"
whisper-rs = { version = "0.16", optional = true, features = ["tracing_backend"] }
sd-vad = { path = "../sd-vad", optional = true }
ort = { version = "=2.0.0-rc.14", optional = true, default-features = false, features = ["std", "ndarray", "load-dynamic", "api-23"] }
ndarray = { version = "0.17", optional = true }
realfft = { version = "3.5", optional = true }
# Reads the feature constants from the model's TorchScript archive (stored entries only).
zip = { version = "9", optional = true, default-features = false }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
