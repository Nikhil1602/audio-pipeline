[package]
name = "sonicdiar-ffi"
description = "C API of SonicDiar (include/sonicdiar.h)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# libsonicdiar.so / .dylib / sonicdiar.dll (+ static library)
name = "sonicdiar"
crate-type = ["cdylib", "staticlib"]

[features]
vulkan = ["sonicdiar-sdk/vulkan"]

[dependencies]
# Renamed: this library itself is called `sonicdiar`.
sonicdiar-sdk = { package = "sonicdiar", path = "../sonicdiar" }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
